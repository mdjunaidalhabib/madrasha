# Legacy static-only configuration. Production uses server/index.mjs so custom
# admin domains receive institution metadata before JavaScript runs.
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_proxied any;
gzip_types
  text/plain
  text/css
  text/xml
  application/xml
  application/json
  application/javascript
  application/wasm
  image/svg+xml
  font/ttf
  font/otf;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }

  # PWA files must never be cached long - the service worker updates itself
  # only when the browser sees a changed sw.js, and the manifest drives install.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # Vite emits content-hashed filenames (e.g. index-C5ndgf4V.js), so a hashed
  # asset's content never changes without its name also changing — safe to
  # cache for a year instead of the usual short expiry.
  # Content-hashed build assets are immutable. Stable public files revalidate.
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ~* ^/fonts/.*\.(ttf|otf|woff2?)$ {
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    add_header Cache-Control "public, max-age=3600, must-revalidate";
    try_files $uri =404;
  }
}
